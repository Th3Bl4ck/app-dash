name: Rigenera dashboard

# Orari in UTC. Con l'ora legale italiana (UTC+2) puntano a essere pronte per
# le 08:00 / 15:15 / 22:30 nei feriali e domenica alle 22:00.
#
# Sono anticipati di ~20 minuti e su minuti sparsi di proposito: i cron di
# GitHub Actions non sono garantiti e agli orari tondi (le 06:00 UTC in testa)
# la coda è lunga — il 27/07 il giro delle 15:15 è partito con 2h35m di
# ritardo. L'anticipo assorbe lo slittamento residuo.
#
# D'inverno (UTC+1) scalano di un'ora: se dà fastidio, si spostano qui.
on:
  schedule:
    - cron: "38 5 * * 1-5"
    - cron: "53 12 * * 1-5"
    - cron: "08 20 * * 1-5"
    - cron: "37 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rigenera
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Rigenera le pagine
        run: python build.py

      - name: Commit se qualcosa è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --staged --quiet; then
            echo "nessuna variazione, niente commit"
          else
            git commit -m "chore: rigenera dashboard $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
