name: Rigenera dashboard

# Orari in UTC. Con l'ora legale italiana (UTC+2) corrispondono a
# 07:57 / 15:12 / 22:27 nei feriali e domenica 21:57 per le settimanali.
#
# Minuti sparsi di proposito: agli orari tondi la coda di GitHub è più lunga.
# Il repo è pubblico anche per questo — da privato i giri partivano con 1-2h
# di ritardo sistematico (27-29/07), i runner dei repo pubblici no.
#
# D'inverno (UTC+1) scalano di un'ora: se dà fastidio, si spostano qui.

on:
  schedule:
    - cron: "57 5 * * 1-5"
    - cron: "12 13 * * 1-5"
    - cron: "27 20 * * 1-5"
    - cron: "57 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rigenera
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Rigenera le pagine
        run: python build.py

      - name: Commit se qualcosa è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --staged --quiet; then
            echo "nessuna variazione, niente commit"
          else
            git commit -m "chore: rigenera dashboard $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
